<!DOCTYPE html>
<!-- HTML structure with document type and language -->
<html lang="en">

<head>
    <!-- Metadata and viewport settings -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arthur's Portfolio</title>
    <style>
        /* Dark Mode styling */
        .dark-mode {
            background-color: #121212;
            color: #ffffff;
        }
    
        /* Styling to clearly distinguish the Featured Content divs */
        .resource-box {
            border: 2px solid #555;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }
        /* Styling for the dark, slightly transparent background overlay */
        #welcome-modal-overlay {
            /* Fixed position keeps it over the entire screen even if you scroll */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Black background with 70% opacity for the transparency effect */
            background-color: rgba(0, 0, 0, 0.7);
            /* z-index ensures the modal sits on top of all other page elements */
            z-index: 1000;
            /* Flexbox centers the modal box vertically and horizontally */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Styling for the actual message box in the center */
        #welcome-modal-box {
            background-color: white;
            /* Force the text inside to be dark so it is readable */
            color: #121212; 
            padding: 30px;
            border-radius: 8px;
            text-align: center;
        }
    </style>
</head>

<body>
    <!-- Custom Welcome Modal Container -->
    <div id="welcome-modal-overlay">
        <div id="welcome-modal-box">
            <h2>Welcome!</h2>
            <p>This page is a work in progress.</p>
            <!-- Button used by JavaScript to dismiss the modal -->
            <button id="close-modal-button">Close</button>
        </div>
    </div>
    <!-- Dark Mode Slider/Checkbox -->
    <div style="padding: 10px;">
        <label>
            <input type="checkbox" id="darkModeToggle"> <strong>Dark Mode</strong>
        </label>
    </div>
    <!-- Dynamic welcome message -->
    <h1 id="welcome-message"></h1>

    <!-- Nav Menu linking 3 different section -->
    <nav>
        <ul>
            <li><a href="#about">About</a></li>
            <li><a href="#projects">Projects</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <main>
        <!-- 3a. About section  -->
        <section id="about">
            <h2>About</h2>
            <p>Hello! I am a Software development student learning JavaScript! 
        </section>
        <!-- Featured Content Section -->
        <section id="featured-content">
            <h2>Featured Content</h2>
        
            <div id="university-resources" class="resource-box">
                <h3>University Resources</h3>
                <a href="https://www.ecpi.edu/programs/software-development-bachelor-degree" target="_blank">ECPI Software
                    Development Program</a>
            </div>
        
            <div id="personal-projects" class="resource-box">
                <h3>Personal Projects</h3>
                <a href="https://github.com/ArtKem2260" target="_blank">
                    <img src="placeholder_github.png" alt="My GitHub Profile" width="200">
                </a>
            </div>
        </section>
        <!-- 3b. Projects section with image links to GitHub projects -->
        <section id="projects">
            <h2>Projects</h2>
            <!-- Image links pointing to placeholder project repositories -->
            <a href="https://github.com/artkem/ArtKem-SDC205/blob/main/finalExam.py">
                
            </a>
            <a href="https://github.com/ArtKem2260/seat-reservation-system">
                <img src="placeholder_seat.png" alt="Seat Reservation System" width="200">
            </a>
            <a href="https://github.com/ArtKem2260/automated-data-charts">
                <img src="placeholder_charts.png" alt="Automated Data Charts" width="200">
            </a>
        </section>

        <!-- 3c. Contact section with an email form -->
        <section id="contact">
            <h2>Contact</h2>
            <form action="#" method="POST">
                <!-- Form fields for sender details and message -->
                <label for="senderName">Sender Name:</label><br>
                <input type="text" id="senderName" name="senderName" required><br><br>

                <label for="emailAddress">Email Address:</label><br>
                <input type="email" id="emailAddress" name="emailAddress" required><br><br>

                <label for="subject">Subject:</label><br>
                <input type="text" id="subject" name="subject" required><br><br>

                <label for="message">Message:</label><br>
                <textarea id="message" name="message" rows="4" required></textarea><br><br>

                <!-- Submit button with a hover tooltip -->
                <button type="submit" title="Click to send your message!">Submit</button>
            </form>
        </section>
    </main>

    <!-- User Interaction script block -->
    <script>
        // --- 1. Custom Welcome Modal Logic ---
            // Find the modal background and the close button in the HTML by their IDs
            const modalOverlay = document.getElementById("welcome-modal-overlay");
            const closeModalButton = document.getElementById("close-modal-button");

            // Tell the close button to listen for a mouse "click"
            closeModalButton.addEventListener("click", function () {
                // When clicked, hide the entire modal overlay by changing its display style to "none"
                modalOverlay.style.display = "none";
            });
        // --- 1. Implement a Loop (Skills List in About Section) ---
            const skills = ["HTML", "C", "Python", "Git", "GitHub"];
            const aboutSection = document.getElementById("about");
            const skillsList = document.createElement("ul");

            skills.forEach(skill => {
                const li = document.createElement("li");
                li.textContent = skill;
                skillsList.appendChild(li);
            });
            aboutSection.appendChild(skillsList);

            // --- 2. Featured Content Visibility Logic ---
            const projectLinks = document.querySelectorAll("#projects a");
            const uniResourcesDiv = document.getElementById("university-resources");
            const personalProjectsDiv = document.getElementById("personal-projects");

            if (projectLinks.length < 3) {
                uniResourcesDiv.style.display = "block";
                personalProjectsDiv.style.display = "block";
            } else {
                personalProjectsDiv.style.display = "block";
                uniResourcesDiv.style.display = "none";
            }

            // --- 3. Persistent Dark Mode Slider ---
                const darkModeToggle = document.getElementById("darkModeToggle");

                // On page load, check the browser's memory (localStorage) to see if Dark Mode was saved as "enabled"
                if (localStorage.getItem("darkModePreference") === "enabled") {
                    // If it was enabled previously, turn on the dark mode styling right away
                    document.body.classList.add("dark-mode");
                    // Check the slider/checkbox so it matches the dark screen
                    darkModeToggle.checked = true;
                }

                // Listen for whenever the user clicks the dark mode checkbox
                darkModeToggle.addEventListener("change", function () {
                    // Toggle the dark mode styling on or off
                    document.body.classList.toggle("dark-mode");

                    // Check if the page is currently in dark mode after the toggle
                    if (document.body.classList.contains("dark-mode")) {
                        // If it is dark, save "enabled" to the browser's memory
                        localStorage.setItem("darkModePreference", "enabled");
                    } else {
                        // If it is light, save "disabled" to the browser's memory
                        localStorage.setItem("darkModePreference", "disabled");
                    }
                });
            
                //Dynamically Add a New Section or Message Using JavaScript
                // 1. Find the existing "Projects" section using its ID so we know where to put our new text
                const projectsSection = document.getElementById("projects");

                // 2. Create a brand new paragraph (<p>) element in the computer's memory
                const newProjectIntro = document.createElement("p");

                // 3. Add some text inside our new paragraph
                newProjectIntro.textContent = "Check out my latest Python project below!";

                // 4. Attach (append) the new paragraph to the bottom of the Projects section
                projectsSection.appendChild(newProjectIntro);


                
                //Reference and Modify Existing Elements with Selectors
                // Element 1: Select the <h2> heading inside the "About" section using querySelector
                const aboutHeading = document.querySelector("#about h2");
                // Modify it: Change the text color of the heading
                aboutHeading.style.color = "lightblue";

                // Element 2: Select the whole "Contact" section using getElementById
                const contactSection = document.getElementById("contact");
                // Modify it: Add a solid border and some padding around the contact section
                contactSection.style.border = "2px dashed gray";
                contactSection.style.padding = "15px";
        
                // TASK 3: Add a Timed Confirmation for Form Submissions
                // Find the submit button and the form in the HTML
                const formSubmitButton = document.querySelector('button[type="submit"]');
                const contactForm = document.querySelector("form");

                // Create an empty paragraph to hold our status messages later
                const statusMessage = document.createElement("p");
                // Add this empty paragraph to the bottom of the form so it's ready to use
                contactForm.appendChild(statusMessage);

                // Tell the submit button to listen for a "click"
                formSubmitButton.addEventListener("click", function (event) {

                    // a. Stop the page from reloading (which is what forms normally do)
                    event.preventDefault();

                    // Get the user's name from the input to check if it's empty
                    const senderName = document.getElementById("senderName").value;

                    if (senderName === "") {
                        // If they didn't type a name, ask them to
                        statusMessage.textContent = "Please fill out the form before submitting.";
                        statusMessage.style.color = "red";
                    } else {
                        // b. Display a loading message dynamically
                        statusMessage.textContent = "Sending message...";
                        statusMessage.style.color = "orange";

                        // c. Use setTimeout() to delay the next step by 2.5 seconds (2500 milliseconds)
                        setTimeout(function () {
                            // d. Replace the loading message with the final confirmation message
                            statusMessage.textContent = "Message sent successfully!";
                            statusMessage.style.color = "lightgreen";

                            // Optional: Clear out the form fields now that it is "sent"
                            contactForm.reset();
                        }, 2500);
                    }
                });
    </script>
</body>

</html>
